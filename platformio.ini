[platformio]
default_envs = transmitter, receiver

[env]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:transmitter]
build_src_filter =
    +<transmitter/>
    -<receiver/>
    -<eavesdropper/>
lib_deps =
    chris--a/Keypad@3.1.1

[env:receiver]
build_src_filter =
    -<transmitter/>
    +<receiver/>
    -<eavesdropper/>
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17

[env:eavesdropper]
build_src_filter =
    -<transmitter/>
    -<receiver/>
    +<eavesdropper/>
